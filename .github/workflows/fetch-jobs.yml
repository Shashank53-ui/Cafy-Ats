name: Fetch Jobs & Sync ATS

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Python Environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend_scrape/requirements.txt'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend_scrape/requirements.txt

      # 2. Setup Node.js Environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # 3. Install Playwright Browsers (Required by both Node/Python scrapers)
      - name: Install Playwright Browsers & Deps
        run: |
          npx playwright install --with-deps chromium
          python -m playwright install chromium

      # 4. Run Job Sync
      - name: Run Fetch/Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: npm run sync
