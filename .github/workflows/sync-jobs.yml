name: Daily ATS Sync

on:
  # DISABLED – replaced by sync-part1/2/3/4.yml
  # Keep workflow_dispatch for manual full-run if needed.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Location normalize in syncAll spawns normalizeLocations.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        
      - name: Run ATS Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        # Source-aware jobs_IR deletes keep LinkedIn rows safe; skip LinkedIn ATS boards here.
        run: npx tsx src/scripts/syncAll.ts --exclude-linkedin
